services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ims-sqlserver
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ims-backend
    environment:
      - ConnectionStrings__DefaultConnection=Server=ims-sqlserver,1433;Database=IMS;User=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
    ports:
      - "5000:5000"
    depends_on:
      - sqlserver
  
volumes:
  sqlserver-data:
